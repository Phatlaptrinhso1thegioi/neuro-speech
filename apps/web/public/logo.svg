<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Brain Silhouette & Synapse Nodes -->
  <path d="M 50 15 C 32 15 20 28 20 44 C 20 54 26 62 33 67 C 33 74 38 80 44 82 C 48 83 50 85 50 88 C 50 85 52 83 56 82 C 62 80 67 74 67 67 C 74 62 80 54 80 44 C 80 28 68 15 50 15 Z" 
        stroke="url(#neonGlow)" stroke-width="2.5" fill="#0B0F19" filter="url(#glow)"/>
  <!-- Speech Waveform -->
  <path d="M 30 50 L 38 50 L 42 35 L 48 65 L 53 40 L 58 58 L 62 48 L 70 48" 
        stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Neural Nodes -->
  <circle cx="36" cy="30" r="2.5" fill="#06B6D4" />
  <circle cx="50" cy="24" r="2.5" fill="#8B5CF6" />
  <circle cx="64" cy="30" r="2.5" fill="#06B6D4" />
</svg>
